<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترانيم تراثية | المكتبة</title>
  <link rel="stylesheet" href="library.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="logo">🎵 ترانيم تراثية</div>
  <a href="index.html" class="back-btn">الرئيسية</a>
</nav>

<header class="library-header">
  <h1>📚 مكتبة الترانيم</h1>
  <p>اختاري الترانيمة اللي عايزة تسمعيها</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 ابحثي عن ترنيمة...">
  </div>

  <div class="filters">
    <button class="filter active" data-category="all">الكل</button>
    <button class="filter" data-category="تسبحة">التسبحة</button>
    <button class="filter" data-category="مناسبات">مناسبات</button>
    <button class="filter" data-category="روحية">روحية</button>
  </div>
</header>

<main>
  <div id="songsContainer" class="songs-container"></div>
  <p id="noResults" class="no-results hidden">ملقيناش ترانيم بالبحث ده 😅</p>
</main>

<div id="player" class="player hidden">
  <div>
    <strong id="currentSong">اختاري ترنيمة</strong>
    <span id="currentCategory"></span>
  </div>
  <audio id="audioPlayer" controls></audio>
</div>

<script src="library.js"></script>
</body>
</html>
